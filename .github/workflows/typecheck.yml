# TypeScript: toàn repo (`typecheck`) + phạm vi MTTQ + hệ thống (`typecheck:mttq`).
# Khi có lỗi ngoài `include` của tsconfig.typecheck-mttq.json, job scoped vẫn xanh để PR module không bị chặn.
name: Typecheck
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tsc-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tsc-mttq-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:mttq
