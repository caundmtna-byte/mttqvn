
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>MTTQVN</title>
    <meta name="description" content="Hệ thống nền tảng số" />
    <meta property="og:title" content="MTTQVN" />
    <meta property="og:description" content="Hệ thống nền tảng số" />
    <meta property="og:image" content="https://datafiles.nghean.gov.vn/nan-ubnd/6556/Album/quochuy%20(1).png" />
    <link rel="icon" type="image/png" href="https://datafiles.nghean.gov.vn/nan-ubnd/6556/Album/quochuy%20(1).png" />
    <link rel="apple-touch-icon" href="https://datafiles.nghean.gov.vn/nan-ubnd/6556/Album/quochuy%20(1).png" />
    
    <!-- Default font (Inter) + Noto Sans fallback – other fonts lazy-loaded on demand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chế độ tối, cỡ chữ, màu chủ đạo, font — áp từ localStorage trước React (giảm nháy). Font: giữ đồng bộ với lib/theme/fonts.ts -->
    <script>
      (function() {
        var SANS_FALLBACK = "'Noto Sans', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'";
        /** family= cho Google CSS2; rỗng = đã có trong link mặc định phía trên — đồng bộ GOOGLE_FONT_CSS2_MAP */
        var GOOGLE_FONT_PARAM = {
          Inter: '',
          'Be Vietnam Pro': 'Be+Vietnam+Pro:wght@400;500;600;700',
          Lexend: 'Lexend:wght@400;500;600;700',
          Nunito: 'Nunito:wght@400;600;700',
          'Source Sans 3': 'Source+Sans+3:wght@400;500;600;700',
          Merriweather: 'Merriweather:wght@400;700'
        };
        function quoteFontName(name) {
          name = (name || '').trim();
          return name.indexOf(' ') >= 0 ? "'" + name + "'" : name;
        }
        function applyFontFromState(state) {
          var el = document.documentElement;
          var ff = state && state.fontFamily;
          if (!ff || !(ff in GOOGLE_FONT_PARAM)) ff = 'Inter';
          var param = GOOGLE_FONT_PARAM[ff];
          if (param) {
            var id = 'gfont-' + ff.replace(/\s+/g, '-');
            if (!document.getElementById(id)) {
              var link = document.createElement('link');
              link.id = id;
              link.rel = 'stylesheet';
              link.href = 'https://fonts.googleapis.com/css2?family=' + param + '&display=swap';
              document.head.appendChild(link);
            }
          }
          el.style.setProperty('--font-sans', quoteFontName(ff) + ', ' + SANS_FALLBACK);
        }
        try {
          var raw = localStorage.getItem('ui-storage');
          if (!raw) return;
          var data = JSON.parse(raw);
          var state = data && data.state;
          if (!state) return;
          var el = document.documentElement;
          // Dark mode
          var scheme = state.colorScheme;
          var isDark = scheme === 'dark' || (scheme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            el.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0f172a');
          } else {
            el.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#ffffff');
          }
          // Text size preference
          var fontSize = state.fontSize;
          if (fontSize) el.dataset.textSize = fontSize;
          // Font — trùng với ThemeSynchronizer / buildSansStackCss (tránh FOUC khi không phải Inter)
          applyFontFromState(state);
          // Primary color – prevent flash of default color
          var colorMap = {
            blue:'221.2 83.2% 53.3%', violet:'262.1 83.3% 57.8%',
            emerald:'142.1 76.2% 36.3%', rose:'346.8 77.2% 49.8%',
            amber:'37.7 92.1% 50.2%', orange:'24.6 95% 53.1%',
            cyan:'188.7 94.5% 42.7%', slate:'215.4 16.3% 46.9%'
          };
          var pc = state.primaryColor;
          if (pc && colorMap[pc]) {
            var v = colorMap[pc];
            el.style.setProperty('--primary', v);
            el.style.setProperty('--ring', v);
            el.style.setProperty('--secondary-foreground', v);
            el.style.setProperty('--accent-foreground', v);
            el.style.setProperty('--color-primary', 'hsl(' + v + ')');
            el.style.setProperty('--color-ring', 'hsl(' + v + ' / 0.5)');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Logo / favicon / PWA từ ui-storage (Thông tin tổ chức) trước khi React mount -->
    <script>
      (function() {
        var DEFAULT_LOGO = 'https://datafiles.nghean.gov.vn/nan-ubnd/6556/Album/quochuy%20(1).png';
        var DEFAULT_NAME = 'MTTQVN';
        var DEFAULT_DESC = 'Hệ thống nền tảng số';
        function guessMime(url) {
          if (!url) return '';
          if (url.indexOf('data:image/png') === 0) return 'image/png';
          if (url.indexOf('data:image/jpeg') === 0 || url.indexOf('data:image/jpg') === 0) return 'image/jpeg';
          if (url.indexOf('data:image/webp') === 0) return 'image/webp';
          if (url.indexOf('data:image/svg') === 0) return 'image/svg+xml';
          var u = url.split('?')[0].toLowerCase();
          if (u.slice(-4) === '.png') return 'image/png';
          if (u.slice(-4) === '.jpg' || u.slice(-5) === '.jpeg') return 'image/jpeg';
          if (u.slice(-5) === '.webp') return 'image/webp';
          if (u.slice(-4) === '.svg') return 'image/svg+xml';
          return '';
        }
        function setMeta(prop, content, isName) {
          var sel = isName ? 'meta[name="' + prop + '"]' : 'meta[property="' + prop + '"]';
          var el = document.querySelector(sel);
          if (!el) {
            el = document.createElement('meta');
            if (isName) el.setAttribute('name', prop);
            else el.setAttribute('property', prop);
            document.head.appendChild(el);
          }
          el.content = content;
        }
        function setIcon(rel, href, mime) {
          var el = document.querySelector('link[rel="' + rel + '"]');
          if (!el) {
            el = document.createElement('link');
            el.rel = rel;
            document.head.appendChild(el);
          }
          el.href = href;
          if (mime) el.type = mime;
          else el.removeAttribute('type');
        }
        function isCloudinaryUrl(url) {
          return url.indexOf('res.cloudinary.com') !== -1;
        }
        function cloudinaryPwaIconUrl(url, size) {
          if (!isCloudinaryUrl(url)) return url;
          try {
            var parsed = new URL(url);
            var parts = parsed.pathname.split('/');
            var uploadIdx = parts.indexOf('upload');
            if (uploadIdx === -1) return url;
            var transform = size === 512 ? 'w_512,h_512,c_pad,f_png' : 'w_192,h_192,c_pad,f_png';
            var next = parts[uploadIdx + 1];
            if (next && (next.indexOf('w_') !== -1 || next.indexOf('c_') !== -1)) {
              parts[uploadIdx + 1] = transform;
            } else {
              parts.splice(uploadIdx + 1, 0, transform);
            }
            parsed.pathname = parts.join('/');
            return parsed.toString();
          } catch (e) {
            return url;
          }
        }
        function setManifestFromBranding(name, desc, logo) {
          var icon192 = isCloudinaryUrl(logo) ? cloudinaryPwaIconUrl(logo, 192) : logo;
          var icon512 = isCloudinaryUrl(logo) ? cloudinaryPwaIconUrl(logo, 512) : logo;
          var icons = [
            { src: icon192, sizes: '192x192', purpose: 'any' },
            { src: icon512, sizes: '512x512', purpose: 'any maskable' }
          ];
          var m192 = guessMime(icon192);
          var m512 = guessMime(icon512);
          if (m192) icons[0].type = m192;
          if (m512) icons[1].type = m512;
          var manifest = {
            name: name,
            short_name: name.slice(0, 12),
            description: desc || name,
            start_url: '/',
            scope: '/',
            display: 'standalone',
            theme_color: '#ffffff',
            background_color: '#ffffff',
            icons: icons
          };
          var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
          var manifestEl = document.querySelector('link[rel="manifest"]');
          if (!manifestEl) {
            manifestEl = document.createElement('link');
            manifestEl.rel = 'manifest';
            document.head.appendChild(manifestEl);
          }
          manifestEl.href = URL.createObjectURL(blob);
        }
        try {
          var raw = localStorage.getItem('ui-storage');
          var ci = null;
          if (raw) {
            var parsed = JSON.parse(raw);
            ci = parsed.state && parsed.state.companyInfo;
          }
          var name = (ci && ci.appName && String(ci.appName).trim()) || DEFAULT_NAME;
          var desc = (ci && ci.appDescription != null) ? String(ci.appDescription).trim() : DEFAULT_DESC;
          var logo = (ci && ci.appLogo && String(ci.appLogo).trim()) || DEFAULT_LOGO;
          var title = desc ? name + ' - ' + desc : name;
          var mime = guessMime(logo);
          document.title = title;
          setIcon('icon', logo, mime);
          setIcon('apple-touch-icon', logo, mime);
          setMeta('og:title', title, false);
          setMeta('og:description', desc || name, false);
          setMeta('og:image', logo, false);
          setMeta('description', desc || name, true);
          setManifestFromBranding(name, desc, logo);
        } catch (e) {}
      })();
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
